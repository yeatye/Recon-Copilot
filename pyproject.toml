[project]
name = "recon-copilot"
version = "0.1.0"
description = "Copilote de reconnaissance assistee par IA pour pentest manuel a faible agressivite"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-docx>=1.1",
    "fpdf2>=2.7",
    "chromadb>=1.0",
    "textual>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "jsonschema>=4.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
recon-copilot = "recon_copilot.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
